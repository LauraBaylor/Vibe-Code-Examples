<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark the Words: Flower Names</title>
    <style>
:root {
  --green: #154734;
  --gold: #ffb81c;
  --cream: #fffaf0;
  --paper: #ffffff;
  --ink: #14211b;
  --muted: #5f6f67;
  --line: #d8e3dd;
  --correct-bg: #cfe9dc;
  --correct-border: #1f7a4e;
  --incorrect-bg: #ffd6d6;
  --incorrect-border: #b3261e;
  --focus: #004f9f;
}

* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  padding: 24px 16px 96px;
  background: linear-gradient(180deg, rgba(255, 184, 28, 0.18), rgba(255, 255, 255, 0) 240px), var(--cream);
  color: var(--ink);
  font-family: "Proxima Nova", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.activity-shell {
  width: min(100%, 980px);
  margin: 0 auto;
}

.activity {
  overflow: hidden;
  background: var(--paper);
  border: 3px solid var(--green);
  border-radius: 8px;
  box-shadow: 0 18px 40px rgba(21, 71, 52, 0.14);
}

.activity-header {
  padding: 24px clamp(18px, 4vw, 40px);
  background: var(--green);
  color: #ffffff;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--gold);
  font-size: 0.95rem;
  font-weight: 800;
  text-transform: uppercase;
}

h1 {
  max-width: 760px;
  margin: 0;
  font-size: clamp(1.45rem, 3.6vw, 2.2rem);
  line-height: 1.2;
}

.story {
  padding: clamp(20px, 4vw, 40px);
  font-size: clamp(1.18rem, 2.5vw, 1.45rem);
  line-height: 1.85;
}

.word {
  min-height: 36px;
  min-width: 34px;
  margin: 2px 1px;
  padding: 2px 3px;
  border: 2px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1.2;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}

.word:hover { background: rgba(255, 184, 28, 0.2); }
.word:disabled:hover { background: transparent; }
.word:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.word.selected { background: rgba(255, 184, 28, 0.36); border-color: var(--gold); }
.word.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--green); font-weight: 800; }
.word.correct:disabled:hover { background: var(--correct-bg); }
.word.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: #6f1711; font-weight: 800; }
.word.locked { cursor: default; }
.punctuation, .space { white-space: pre-wrap; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 clamp(20px, 4vw, 40px) 24px;
}

button { font-family: inherit; }

.primary-button,
.secondary-button {
  min-height: 48px;
  border-radius: 8px;
  padding: 12px 20px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
}

.primary-button {
  border: 2px solid var(--green);
  background: var(--green);
  color: #ffffff;
}

.primary-button:hover {
  background: var(--gold);
  color: var(--green);
}

.secondary-button {
  border: 2px solid var(--green);
  background: var(--gold);
  color: var(--green);
}

.secondary-button:hover {
  background: var(--green);
  color: #ffffff;
}

.feedback {
  margin: 0 clamp(20px, 4vw, 40px) 32px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #f8fbf9;
}

.feedback-tab {
  display: inline-flex;
  min-width: 132px;
  min-height: 40px;
  align-items: center;
  justify-content: center;
  margin: -2px 0 0 -2px;
  padding: 8px 16px;
  border-radius: 8px 0 8px 0;
  background: var(--green);
  color: #ffffff;
  font-weight: 800;
}

.feedback p {
  margin: 14px 16px 16px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.45;
}

.feedback.correct-state { border-color: var(--correct-border); background: #edf8f2; }
.feedback.correct-state .feedback-tab { background: var(--correct-border); }
.feedback.incorrect-state { border-color: var(--incorrect-border); background: #fff4f4; }
.feedback.incorrect-state .feedback-tab { background: var(--incorrect-border); }

.scorebar {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 0;
  padding: 18px 16px;
  background: var(--green);
  color: #ffffff;
  box-shadow: 0 -8px 20px rgba(21, 71, 52, 0.22);
}

.scorebar-content {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px;
  width: min(100%, 980px);
  margin: 0 auto;
  align-items: center;
  font-size: clamp(1.3rem, 3vw, 1.65rem);
  font-weight: 800;
}

.meter {
  height: 28px;
  overflow: hidden;
  border: 2px solid #ffffff;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.22);
}

.meter-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--gold);
  transition: width 220ms ease;
}

.hidden { display: none; }

@media (max-width: 620px) {
  body { padding: 12px 10px 104px; }
  .activity-header { padding: 20px 18px; }
  .story { padding: 18px; line-height: 1.75; }
  .word { min-height: 40px; min-width: 32px; margin-top: 3px; margin-bottom: 3px; }
  .actions { padding: 0 18px 20px; }
  .primary-button, .secondary-button { flex: 1 1 100%; }
  .feedback { margin: 0 18px 24px; }
  .scorebar-content { grid-template-columns: 1fr; gap: 10px; }
  .meter { height: 24px; }
}

</style>
  </head>
  <body>
    <main class="activity-shell">
      <section class="activity" aria-labelledby="activity-title">
        <div class="activity-header">
          <p class="eyebrow">Mark the Words</p>
          <h1 id="activity-title">As you read the story, click on the names of flowers.</h1>
        </div>
        <div id="story" class="story" aria-label="Story text"></div>
        <div class="actions" aria-label="Activity controls">
          <button id="checkAnswers" class="primary-button" type="button">Check Answers</button>
          <button id="retry" class="secondary-button hidden" type="button">Retry</button>
        </div>
        <section id="feedback" class="feedback neutral" aria-live="polite" aria-atomic="true">
          <div class="feedback-tab">Ready</div>
          <p>Select every flower name in the story, then check your answers.</p>
        </section>
      </section>
    </main>
    <footer class="scorebar" aria-label="Score">
      <div class="scorebar-content">
        <span id="scoreText">0/8 CORRECT</span>
        <div class="meter" aria-hidden="true"><div id="scoreFill" class="meter-fill"></div></div>
      </div>
    </footer>
    <script>
const storyText = "The town of Rose Village is a quaint little town which boasts the most exquisite flower gardens anyone has ever seen. Flower enthusiasts from around the world come to see the gardens of Rose Village. When visitors first enter the town, they are met with a welcome sign that is draped in fragrant white, yellow, and purple Jasmine. Once checked-in at the Hotel de Hibiscus they can stroll through the town square and down Peony Pass and picnic at Waterlily Falls. Finally, travelers end their day by sitting on the lawn of Discovery Green and listening to the Orchid City Orchestra while watching the sun disappear behind the picturesque horizon. Whether you are a flower enthusiast or not, Rose Village is the place to experience the most splendid blooms known to man.";
const correctFlowerWords = new Set(["Rose", "Jasmine", "Hibiscus", "Peony", "Waterlily", "Orchid"]);

const story = document.querySelector("#story");
const checkButton = document.querySelector("#checkAnswers");
const retryButton = document.querySelector("#retry");
const feedback = document.querySelector("#feedback");
const feedbackTab = feedback.querySelector(".feedback-tab");
const feedbackText = feedback.querySelector("p");
const scoreText = document.querySelector("#scoreText");
const scoreFill = document.querySelector("#scoreFill");

let wordButtons = [];
let totalCorrect = 0;
let hasPendingIncorrect = false;
let scormApi = null;
let scormConnected = false;

function tokenize(text) {
  return text.match(/[A-Za-z]+(?:-[A-Za-z]+)?|[^A-Za-z]+/g) || [];
}

function renderStory() {
  story.innerHTML = "";
  wordButtons = [];
  totalCorrect = 0;

  tokenize(storyText).forEach((token) => {
    if (/^[A-Za-z]+(?:-[A-Za-z]+)?$/.test(token)) {
      const button = document.createElement("button");
      const isCorrect = correctFlowerWords.has(token);
      button.type = "button";
      button.className = "word";
      button.textContent = token;
      button.dataset.correct = String(isCorrect);
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-label", `${token}, not selected`);

      if (isCorrect) totalCorrect += 1;

      button.addEventListener("click", () => toggleWord(button));
      story.append(button);
      wordButtons.push(button);
    } else {
      const span = document.createElement("span");
      span.className = /\s/.test(token) ? "space" : "punctuation";
      span.textContent = token;
      story.append(span);
    }
  });
}

function toggleWord(button) {
  const wasIncorrect = button.classList.contains("incorrect");
  if (hasPendingIncorrect) clearIncorrectSelections();
  if (wasIncorrect || button.classList.contains("locked")) return;

  button.classList.toggle("selected");
  const selected = button.classList.contains("selected");
  button.setAttribute("aria-pressed", String(selected));
  button.setAttribute("aria-label", `${button.textContent}, ${selected ? "selected" : "not selected"}`);
}

function clearIncorrectSelections() {
  wordButtons.forEach((button) => {
    if (!button.classList.contains("incorrect")) return;
    button.classList.remove("incorrect", "selected");
    button.setAttribute("aria-pressed", "false");
    button.setAttribute("aria-label", `${button.textContent}, not selected`);
  });
  hasPendingIncorrect = false;
}

function updateScore() {
  const correctSelected = wordButtons.filter((button) => button.dataset.correct === "true" && button.classList.contains("selected")).length;
  scoreText.textContent = `${correctSelected}/${totalCorrect} CORRECT`;
  scoreFill.style.width = `${(correctSelected / totalCorrect) * 100}%`;
  return correctSelected;
}

function setFeedback(state, title, message) {
  feedback.classList.remove("neutral", "correct-state", "incorrect-state");
  feedback.classList.add(state);
  feedbackTab.textContent = title;
  feedbackText.textContent = message;
}

function findScormApi(win) {
  let currentWindow = win;
  let searchDepth = 0;

  while (currentWindow && searchDepth < 7) {
    try {
      if (currentWindow.API) return currentWindow.API;
      if (currentWindow.parent === currentWindow) break;
      currentWindow = currentWindow.parent;
      searchDepth += 1;
    } catch (error) {
      break;
    }
  }

  try {
    if (win.opener) return findScormApi(win.opener);
  } catch (error) {
    return null;
  }

  return null;
}

function scormSetValue(key, value) {
  if (scormConnected && scormApi) scormApi.LMSSetValue(key, String(value));
}

function scormCommit() {
  if (scormConnected && scormApi) scormApi.LMSCommit("");
}

function initScorm() {
  scormApi = findScormApi(window);
  if (!scormApi) return;

  scormConnected = scormApi.LMSInitialize("") === "true";
  if (!scormConnected) return;

  const currentStatus = scormApi.LMSGetValue("cmi.core.lesson_status");
  scormSetValue("cmi.core.score.min", 0);
  scormSetValue("cmi.core.score.max", totalCorrect);
  scormSetValue("cmi.core.score.raw", 0);

  if (currentStatus !== "completed" && currentStatus !== "passed") {
    scormSetValue("cmi.core.lesson_status", "incomplete");
  }

  scormCommit();
}

function updateScormProgress(score) {
  scormSetValue("cmi.core.score.raw", score);
  scormSetValue("cmi.core.lesson_status", score === totalCorrect ? "completed" : "incomplete");
  scormCommit();
}

function finishScorm() {
  if (!scormConnected || !scormApi) return;
  scormCommit();
  scormApi.LMSFinish("");
  scormConnected = false;
}

function checkAnswers() {
  let allCorrect = true;
  hasPendingIncorrect = false;

  wordButtons.forEach((button) => {
    const selected = button.classList.contains("selected");
    const correct = button.dataset.correct === "true";
    button.classList.remove("incorrect");

    if (selected && correct) {
      button.classList.add("correct", "locked");
      button.setAttribute("aria-label", `${button.textContent}, correct`);
    } else if (selected && !correct) {
      allCorrect = false;
      button.classList.add("incorrect");
      button.setAttribute("aria-label", `${button.textContent}, incorrect`);
      hasPendingIncorrect = true;
    } else if (correct) {
      allCorrect = false;
    }
  });

  const correctSelected = updateScore();
  updateScormProgress(correctSelected);

  if (allCorrect && correctSelected === totalCorrect) {
    setFeedback("correct-state", "Correct", "Perfect score! You found every flower name.");
    retryButton.classList.remove("hidden");
    checkButton.classList.add("hidden");
    wordButtons.forEach((button) => {
      button.disabled = true;
      button.classList.add("locked");
    });
  } else {
    setFeedback("incorrect-state", "Try Again", "Not quite. Look for the flower names and try again.");
    retryButton.classList.add("hidden");
  }
}

function resetActivity() {
  hasPendingIncorrect = false;
  wordButtons.forEach((button) => {
    button.className = "word";
    button.disabled = false;
    button.setAttribute("aria-pressed", "false");
    button.setAttribute("aria-label", `${button.textContent}, not selected`);
  });

  checkButton.disabled = false;
  checkButton.classList.remove("hidden");
  retryButton.classList.add("hidden");
  setFeedback("neutral", "Ready", "Select every flower name in the story, then check your answers.");
  updateScore();
  updateScormProgress(0);
}

checkButton.addEventListener("click", checkAnswers);
retryButton.addEventListener("click", resetActivity);
window.addEventListener("beforeunload", finishScorm);

renderStory();
updateScore();
initScorm();

</script>
  </body>
</html>
